services:
  - type: web
    name: auto-sponsor-ads
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: META_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: META_API_VERSION
        value: v21.0
